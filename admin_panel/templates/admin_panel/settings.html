<!DOCTYPE html>
<html>

<head>

    <title>NEXOVA - Settings</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .settings-box {
            background: white;
            padding: 30px;
            max-width: 600px;
            border-radius: 8px;
        }

        .setting-row {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row input {
            width: auto;
        }

        input[type="number"] {
            width: 150px;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 20px;
        }

        .success {
            color: green;
            margin-bottom: 20px;
        }
    </style>

</head>


<body>


    <header>

        <h1>NEXOVA ADMIN</h1>

    </header>


    <div class="container">


        <div class="settings-box">

            <h2>Billing Settings</h2>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            {% if success %}

            <div class="success">
                {{ success }}
            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}

                <div class="setting-row">

                    {% if tax_enabled %}

                    <input type="checkbox" id="tax_enabled" name="tax_enabled" checked>

                    {% else %}

                    <input type="checkbox" id="tax_enabled" name="tax_enabled">

                    {% endif %}

                    <label for="tax_enabled">
                        Include tax in bills
                    </label>

                </div>


                <div class="setting-row">

                    <label for="tax_rate">
                        Tax Rate (%)
                    </label>

                    <input type="number" id="tax_rate" name="tax_rate" step="0.01" min="0" value="{{ tax_rate }}"
                        required>

                </div>


                <button type="submit">
                    Save Settings
                </button>

            </form>


            <br>

            <a href="{% url 'admin_panel:dashboard' %}">
                ← Back to Dashboard
            </a>

        </div>


    </div>


</body>

</html>
