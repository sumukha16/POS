<!DOCTYPE html>
<html>

<head>

    <title>
        NEXOVA -
        {% if category %}
        Edit Category
        {% else %}
        Add Category
        {% endif %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .form-box {
            background: white;
            padding: 30px;
            max-width: 500px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>

</head>


<body>


    <header>

        <h1>NEXOVA ADMIN</h1>

    </header>


    <div class="container">


        <div class="form-box">

            <h2>

                {% if category %}
                Edit Category
                {% else %}
                Add Category
                {% endif %}

            </h2>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <label>
                    Category Name
                </label>

                <input type="text" name="name" value="{{ category.name|default:'' }}" required>


                <label>
                    Category Type
                </label>

                <select name="category_type" required>

                    <option value="">
                        Select Type
                    </option>

                    {% if category %}

                    {% if category.category_type == "FOOD" %}

                    <option value="FOOD" selected>
                        Food
                    </option>

                    {% else %}

                    <option value="FOOD">
                        Food
                    </option>

                    {% endif %}


                    {% if category.category_type == "DRINK" %}

                    <option value="DRINK" selected>
                        Drink
                    </option>

                    {% else %}

                    <option value="DRINK">
                        Drink
                    </option>

                    {% endif %}

                    {% else %}

                    <option value="FOOD">
                        Food
                    </option>

                    <option value="DRINK">
                        Drink
                    </option>

                    {% endif %}

                </select>


                <button type="submit">

                    {% if category %}
                    Save Changes
                    {% else %}
                    Create Category
                    {% endif %}

                </button>

            </form>


            <br>

            <a href="{% url 'admin_panel:categories' %}">
                Cancel
            </a>

        </div>


    </div>


</body>

</html>
