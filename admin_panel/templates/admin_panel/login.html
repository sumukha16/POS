<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXOVA Admin Login</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f5f5;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #111;

        }


        .login-container {

            width: 100%;

            max-width: 400px;

            padding: 20px;

        }


        .login-card {

            background: #fff;

            border: 1px solid #ddd;

            border-radius: 12px;

            padding: 36px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

        }


        .brand {

            text-align: center;

            font-size: 22px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 600;

            color: #333;

        }


        input {

            width: 100%;

            height: 44px;

            padding: 0 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            outline: none;

            font-size: 14px;

            background: #fff;

        }


        input:focus {

            border-color: #111;

            box-shadow:
                0 0 0 2px rgba(0, 0, 0, 0.08);

        }


        .error {

            margin-bottom: 18px;

            padding: 10px 12px;

            border-radius: 6px;

            background: #fdecec;

            border: 1px solid #f5c2c2;

            color: #b42318;

            font-size: 12px;

        }


        button {

            width: 100%;

            height: 44px;

            margin-top: 8px;

            border: none;

            border-radius: 6px;

            background: #111;

            color: #fff;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

        }


        button:hover {

            background: #222;

        }


        .footer {

            text-align: center;

            margin-top: 22px;

            color: #999;

            font-size: 11px;

        }


        @media (max-width: 480px) {

            .login-container {

                padding: 15px;

            }


            .login-card {

                padding: 28px 22px;

            }

        }
    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="brand">
                NEXOVA
            </div>


            <div class="subtitle">
                Administrator Login
            </div>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" placeholder="Enter username"
                        autocomplete="username" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter password"
                        autocomplete="current-password" required>

                </div>


                <button type="submit">
                    Login
                </button>


            </form>


            <div class="footer">
                NEXOVA POS Administration
            </div>


        </div>


    </div>


</body>

</html>
