<!DOCTYPE html>
<html>

<head>

    <title>
        NEXOVA -
        {% if table %}
        Edit Table
        {% else %}
        Add Table
        {% endif %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        .container {
            padding: 30px;
        }

        .form-box {
            background: white;
            padding: 30px;
            max-width: 500px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>

</head>


<body>


    <header>

        <h1>NEXOVA ADMIN</h1>

    </header>


    <div class="container">


        <div class="form-box">


            <h2>

                {% if table %}
                Edit Table
                {% else %}
                Add Table
                {% endif %}

            </h2>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <label>
                    Table Name
                </label>

                <input type="text" name="name" value="{{ table.name|default:'' }}" required>


                <label>
                    Section
                </label>

                <select name="section" required>

                    <option value="">
                        Select Section
                    </option>


                    {% for section in sections %}

                    {% if table and table.section_id == section.id %}

                    <option value="{{ section.id }}" selected>
                        {{ section.name }}
                    </option>

                    {% else %}

                    <option value="{{ section.id }}">
                        {{ section.name }}
                    </option>

                    {% endif %}

                    {% endfor %}

                </select>


                <label>
                    Display Order
                </label>

                <input type="number" name="display_order" min="0" value="{{ table.display_order|default:0 }}" required>


                <button type="submit">

                    {% if table %}
                    Save Changes
                    {% else %}
                    Create Table
                    {% endif %}

                </button>

            </form>


            <br>

            <a href="{% url 'admin_panel:tables' %}">
                Cancel
            </a>


        </div>


    </div>


</body>

</html>
