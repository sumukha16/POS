<!DOCTYPE html>
<html>

<head>

    <title>
        NEXOVA -
        {% if item %}
        Edit Menu Item
        {% else %}
        Add Menu Item
        {% endif %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .form-box {
            background: white;
            padding: 30px;
            max-width: 500px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>

</head>


<body>


    <header>

        <h1>NEXOVA ADMIN</h1>

    </header>


    <div class="container">


        <div class="form-box">


            <h2>

                {% if item %}
                Edit Menu Item
                {% else %}
                Add Menu Item
                {% endif %}

            </h2>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <label>
                    Item Name
                </label>

                <input type="text" name="name" value="{{ item.name|default:'' }}" required>


                <label>
                    Item Code
                </label>

                <input type="text" name="code" value="{{ item.code|default:'' }}" required>


                <label>
                    Category
                </label>

                <select name="category" required>

                    <option value="">
                        Select Category
                    </option>

                    {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                        —
                        {{ category.get_category_type_display }}
                    </option>

                    {% endfor %}

                </select>


                <label>
                    Price (₹)
                </label>

                <input type="number" name="price" step="0.01" min="0" value="{% if item %}{{ price_rupees }}{% endif %}"
                    required>


                <button type="submit">

                    {% if item %}
                    Save Changes
                    {% else %}
                    Create Menu Item
                    {% endif %}

                </button>


            </form>


            <br>

            <a href="{% url 'admin_panel:menu_items' %}">
                Cancel
            </a>


        </div>


    </div>


</body>

</html>
