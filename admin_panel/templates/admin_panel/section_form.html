<!DOCTYPE html>
<html>

<head>

    <title>
        NEXOVA -
        {% if section %}
        Edit Section
        {% else %}
        Add Section
        {% endif %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        .container {
            padding: 30px;
        }

        .form-box {
            background: white;
            padding: 30px;
            max-width: 500px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>

</head>


<body>


    <header>

        <h1>NEXOVA ADMIN</h1>

    </header>


    <div class="container">


        <div class="form-box">


            <h2>

                {% if section %}
                Edit Section
                {% else %}
                Add Section
                {% endif %}

            </h2>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <label>
                    Section Name
                </label>

                <input type="text" name="name" value="{{ section.name|default:'' }}" required>


                <label>
                    Display Order
                </label>

                <input type="number" name="display_order" min="0" value="{{ section.display_order|default:0 }}"
                    required>


                <button type="submit">

                    {% if section %}
                    Save Changes
                    {% else %}
                    Create Section
                    {% endif %}

                </button>

            </form>


            <br>

            <a href="{% url 'admin_panel:sections' %}">
                Cancel
            </a>


        </div>


    </div>


</body>

</html>
